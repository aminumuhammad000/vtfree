# VTfree Nginx Configuration

# 1. Landing Page (vtfree.com.ng)
server {
    listen 80;
    server_name vtfree.com.ng;

    root /var/www/vtfree/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to API if needed or for specific routes
}

# 2. Main App (app.vtfree.com.ng)
server {
    listen 80;
    server_name app.vtfree.com.ng;

    root /var/www/vtfree/app-templete/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 3. Vendor Admin (vendor.vtfree.com.ng)
server {
    listen 80;
    server_name vendor.vtfree.com.ng;

    root /var/www/vtfree/app-admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 4. Super Admin (admin.vtfree.com.ng)
server {
    listen 80;
    server_name admin.vtfree.com.ng;

    root /var/www/vtfree/super-admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 5. Backend API (api.vtfree.com.ng)
server {
    listen 80;
    server_name api.vtfree.com.ng;

    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard CORS headers (usually handled by the backend, but added for safety)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}
